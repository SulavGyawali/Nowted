services:
  backend:
    build: ./backend
    container_name: nowted-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mongo
    environment:
      - DATABASE_URL=postgresql://admin:1@db:5432/notes
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URL=mongodb://admin:1@mongo:27017/notes?authSource=admin
      - ACCESS_TOKEN_EXPIRE_DAYS=30
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - SECRET_KEY=supersecretkey
      - ALGORITHM=HS256
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend
    container_name: nowted-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    stdin_open: true
    tty: true
    restart: always

  db:
    image: postgres:16
    container_name: nowted-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nowted-redis
    ports:
      - "6379:6379"
    restart: always

  mongo:
    image: mongo:7
    container_name: nowted-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1
      MONGO_INITDB_DATABASE: notes
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: